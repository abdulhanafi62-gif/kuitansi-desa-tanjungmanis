name: Build SI-SERAH DESA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json sw.js logo-kutim.png android/app/src/main/assets/
          echo "Web assets copied successfully into Android asset folder."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          ls -lh build-output/

      - name: Upload APK as Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SI-SERAH-DESA-TANJUNG-MANIS-APK
          path: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.3
          name: "Rilis Resmi APK SI-SERAH DESA v1.0.3 (Perbaikan Unduh & Buka Otomatis File Excel di HP)"
          body: |
            ### Pembaruan Resmi BAST & Kuitansi Kas Desa Tanjung Manis (Versi 1.0.3)
            Khusus Kaur Keuangan - Kec. Sangkulirang, Kab. Kutai Timur.

            **Pembaruan Penting v1.0.3:**
            - 📥 **Perbaikan Unduh File Rekap Excel di Android**: File `.xls` kini langsung tersimpan di folder **Download** HP dan secara otomatis membuka menu pilihan aplikasi (*WPS Office / Microsoft Excel / Google Spreadsheet*) di HP Anda.
            - 📲 **Fitur Baru "Bagikan Excel"**: Tombol khusus untuk langsung membagikan file Rekap Excel ke WhatsApp, Google Drive, atau Email dengan satu klik.
            - 🖼️ **Simpan Gambar Kuitansi ke Galeri**: Gambar kuitansi kini langsung tersimpan secara permanen ke galeri foto HP (folder *Pictures/KuitansiDesa*).
            - 📄 **Format PDF 1 Halaman Utuh (Pas A4)**: Tidak terpotong ke lembar 2, tanda tangan & klausul tanggung jawab mutlak rapi berdampingan.
            - 🏛️ **Kop Surat & Logo Resmi Kutai Timur**: Alamat resmi Desa Tanjung Manis lengkap dengan logo Pemkab Kutai Timur.
            
            **Unduh file APK di bawah ini dan pasang langsung di HP Android Anda:**
          files: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
