name: Build SI-SERAH DESA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json sw.js android/app/src/main/assets/
          echo "Web assets copied successfully into Android asset folder."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.2

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          ls -lh build-output/

      - name: Upload APK as Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SI-SERAH-DESA-TANJUNG-MANIS-APK
          path: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Rilis Resmi APK SI-SERAH DESA v1.0.0"
          body: |
            ### Aplikasi Resmi BAST & Kuitansi Digital Kas Desa Tanjung Manis
            Khusus Kaur Keuangan - Kec. Sangkulirang, Kab. Kutai Timur.

            **Fitur:**
            - Kunci Satelit GPS Otomatis
            - Stempel Foto Forensik Anti-Rekayasa
            - Tanda Tangan Digital di Layar HP
            - Segel Kriptografi SHA-256
            - 100% Offline Ready
            
            **Unduh file APK di bawah ini dan pasang langsung di HP Android Anda:**
          files: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
