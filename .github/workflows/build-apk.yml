name: Build SI-SERAH DESA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json sw.js logo-kutim.png android/app/src/main/assets/
          echo "Web assets copied successfully into Android asset folder."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          ls -lh build-output/

      - name: Upload APK as Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SI-SERAH-DESA-TANJUNG-MANIS-APK
          path: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.2
          name: "Rilis Resmi APK SI-SERAH DESA v1.0.2 (Format Rapi 1 Halaman A4 & Rekap Excel)"
          body: |
            ### Pembaruan Resmi BAST & Kuitansi Kas Desa Tanjung Manis (Versi 1.0.2)
            Khusus Kaur Keuangan - Kec. Sangkulirang, Kab. Kutai Timur.

            **Pembaruan Penting v1.0.2:**
            - 📄 **Format PDF Pas 1 Halaman Penuh A4**: Penataan ulang elemen tata letak sehingga bukti tanda tangan dan klausul tanggung jawab mutlak berada dalam satu lembar rapi tanpa terpotong ke halaman 2.
            - 🏛️ **Kop Surat Resmi Kabupaten Kutai Timur**: Dilengkapi Logo Kabupaten Kutai Timur di sisi kiri atas serta alamat resmi: *Jl. Poros RT. 003 Dusun I Desa Tanjung Manis Kecamatan Sangkulirang Kode Pos 75684*.
            - 📊 **Ekspor Laporan Rekapitulasi Excel Bergaris Rapi**: Menghasilkan file spreadsheet `.xls` resmi yang dilengkapi garis tabel (*all borders*), rekap per pihak penerima (Kades, BPD, PKA), total kumulatif dana, dan kolom tanda tangan untuk pertanggungjawaban SPJ & audit BPD/Inspektorat.
            - 🏢 **Pilihan Cepat & Manual Lokasi**: Pilihan lokasi instan (Kantor Desa, Rumah Kades, dll) serta input manual alamat penyerahan.
            - 🔒 **Segel Digital SHA-256 & 100% Offline Ready**: Data tersimpan aman di database lokal HP Anda dan keaslian transaksi terverifikasi dengan hash kriptografi.
            
            **Unduh file APK di bawah ini dan pasang langsung di HP Android Anda:**
          files: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
