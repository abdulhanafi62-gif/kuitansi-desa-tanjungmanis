name: Build SI-SERAH DESA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json sw.js logo-kutim.png xlsx.full.min.js android/app/src/main/assets/
          echo "Web assets copied successfully into Android asset folder."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          ls -lh build-output/

      - name: Upload APK as Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SI-SERAH-DESA-TANJUNG-MANIS-APK
          path: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.5
          name: "Rilis Resmi APK SI-SERAH DESA v1.0.5 (Tabel Excel Bergaris Penuh Sesuai Pratinjau)"
          body: |
            ### Pembaruan Resmi BAST & Kuitansi Kas Desa Tanjung Manis (Versi 1.0.5)
            Khusus Kaur Keuangan - Kec. Sangkulirang, Kab. Kutai Timur.

            **Pembaruan Penting v1.0.5:**
            - 📏 **Garis Tabel Penuh (*All Borders*) di Setiap Sel**: Seluruh baris tabel kini memiliki garis tepi hitam tegas (*borders*) persis seperti pratinjau di aplikasi, bukan lagi teks polos acak.
            - 🎨 **Warna & Tata Letak Rapi (Persis Pratinjau)**:
              - *Header Biru Tua*: Teks putih tebal di baris judul kolom.
              - *Kop Surat Tergabung (*Merged*)*: Terpusat rapi di atas tabel.
              - *Nominal Berformat Rupiah*: Rata kanan dengan format angka resmi.
              - *Catatan Kaur Berwarna Lembut*: Rapi dan mudah dibaca pemeriksa.
              - *Baris Total Bergaris Ganda*: Dengan latar biru muda resmi akuntansi.
            - 📄 **Tombol Baru: Cetak PDF Rekapitulasi**: Bisa langsung cetak atau simpan seluruh buku kas ke format PDF resmi.
            - 📲 **Kirim ke WhatsApp**: Bagikan file `.xlsx` yang sudah bergaris rapi langsung ke WhatsApp.
            
            **Unduh file APK di bawah ini dan pasang langsung di HP Android Anda:**
          files: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
