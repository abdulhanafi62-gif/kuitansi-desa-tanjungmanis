name: Build SI-SERAH DESA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html styles.css app.js manifest.json sw.js logo-kutim.png xlsx.full.min.js android/app/src/main/assets/
          echo "Web assets copied successfully into Android asset folder."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: android

      - name: Build Android APK (assembleDebug)
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          ls -lh build-output/

      - name: Upload APK as Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SI-SERAH-DESA-TANJUNG-MANIS-APK
          path: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.4
          name: "Rilis Resmi APK SI-SERAH DESA v1.0.4 (Format Asli .xlsx & Pratinjau Tabel Lengkap)"
          body: |
            ### Pembaruan Resmi BAST & Kuitansi Kas Desa Tanjung Manis (Versi 1.0.4)
            Khusus Kaur Keuangan - Kec. Sangkulirang, Kab. Kutai Timur.

            **Pembaruan Penting v1.0.4:**
            - 📊 **Format Asli Excel OpenXML (.xlsx)**: Menggunakan SheetJS standar industri sehingga file dijamin terbaca 100% lengkap berisi baris dan kolom di semua aplikasi HP (WPS Office, Microsoft Excel Mobile, Google Spreadsheet). Tidak ada lagi masalah file kosong atau peringatan format.
            - 📑 **Sheet Ganda Otomatis**: 
              - *Sheet 1 (Buku Kas APBDes)*: Rincian 12 kolom lengkap, catatan kaur, dan pengesahan tanda tangan.
              - *Sheet 2 (Rekap per Penerima)*: Ringkasan akumulasi penyerahan ke Kepala Desa, BPD, dan PKA.
            - 📋 **Pratinjau Tabel Langsung di Layar HP**: Pada tab Rekapitulasi kini langsung muncul tabel buku kas desa lengkap dengan warna dan garis tegas, sehingga Anda bisa langsung melihat data tanpa harus membuka aplikasi lain.
            - 📑 **Pilihan Ekspor CSV Ringan (.csv)**: Opsi tambahan untuk unduh data dalam format CSV universal.
            - 📲 **Bagikan ke WhatsApp (.xlsx)**: Kirim laporan Excel resmi langsung ke WhatsApp dengan satu kali sentuh.
            
            **Unduh file APK di bawah ini dan pasang langsung di HP Android Anda:**
          files: build-output/SI-SERAH-DESA-TANJUNG-MANIS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
